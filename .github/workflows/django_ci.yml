name: Django API Test Suite (CI)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  run_tests:
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ${{ secrets.LIVE_DB_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: ./backend

    steps:

      - name: Checkout Project Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-django

      - name: Run Tests via Pytest
        env:
          SECRET_KEY: ${{secrets.MY_PRODUCTION_SECRET_KEY}}
          DEBUG: "True"
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: ${{secrets.LIVE_DB_PASSWORD}}
          DB_HOST: localhost
          DB_PORT: 5432

        run: |
          echo "Testing how GitHub protects our secret key: ${{secrets.MY_PRODUCTION_SECRET_KEY}}"
          pytest

  build_docker_image:
    runs-on: ubuntu-latest
    needs: run_tests

    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image (Test Build)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            mohsen00sleman/learning-platform-api:latest
            mohsen00sleman/learning-platform-api:${{ github.sha }}
